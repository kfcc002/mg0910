<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사내 업무지원</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:#f5f7fb;color:#172033}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 18px}
.card{width:min(720px,100%);background:#fff;border:1px solid #e7ecf2;border-radius:24px;padding:42px;box-shadow:0 16px 40px rgba(30,60,100,.1)}
.badge{display:inline-block;padding:6px 11px;border-radius:999px;background:#edf5ff;color:#16497f;font-size:12px;font-weight:800}
h1{margin:16px 0 10px;font-size:clamp(30px,5vw,46px);letter-spacing:-.04em}
p{color:#667085;line-height:1.7}
.actions{margin-top:28px;padding-top:24px;border-top:1px solid #e4e9f0}
.faq-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:270px;min-height:60px;padding:16px 24px;border-radius:16px;background:linear-gradient(135deg,#16497f,#1f5fa8);color:#fff;text-decoration:none;font-size:17px;font-weight:800;box-shadow:0 10px 24px rgba(31,95,168,.22);transition:.2s}
.faq-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(31,95,168,.28)}
.faq-btn:focus-visible{outline:4px solid rgba(31,95,168,.18);outline-offset:3px}
.icon{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.16)}
@media(max-width:600px){
  .page{align-items:flex-start;padding:18px 12px}
  .card{padding:28px 20px;border-radius:18px}
  .faq-btn{width:100%;min-width:0;font-size:16px}
  .actions{margin-top:22px;padding-top:20px}
}
</style>
</head>
<body>
<main class="page">
<section class="card">
<span class="badge">업무지원 서비스</span>
<h1>사내 업무 도우미</h1>
<p>등록된 FAQ 데이터에서 필요한 업무 질문과 답변을 빠르게 찾아보세요.</p>

<div class="actions">
<a class="faq-btn" href="./faq.html" aria-label="업무 FAQ 검색 페이지로 이동">
<span class="icon">?</span>
업무 FAQ 검색하기
<span>→</span>
</a>
</div>
</section>
</main>
</body>
</html>
