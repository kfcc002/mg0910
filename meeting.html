<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회의·업무지시 후속조치 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f6f7fb;--panel:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#111827}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1440px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}
    h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:6px}.refresh{border:0;background:#111827;color:#fff;padding:11px 16px;border-radius:10px;cursor:pointer}
    .cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:18px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
    .label{font-size:13px;color:var(--muted)}.value{font-size:30px;font-weight:800;margin-top:8px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;background:#fff;padding:14px;border-radius:14px;border:1px solid var(--line);margin-bottom:14px}
    input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}.tablebox{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:1180px}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}th{background:#f9fafb;position:sticky;top:0;z-index:1}.muted{color:var(--muted)}
    .badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.지연{background:#fee2e2;color:#991b1b}.오늘마감{background:#ffedd5;color:#9a3412}.임박{background:#fef3c7;color:#92400e}.정상{background:#dbeafe;color:#1e40af}.완료{background:#dcfce7;color:#166534}
    .pbar{width:120px;height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:6px}.pbar span{display:block;height:100%;background:#111827}.empty{padding:40px;text-align:center;color:var(--muted)}
    @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.top{align-items:start;flex-direction:column}.wrap{padding:16px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>회의·업무지시 후속조치 대시보드</h1><div class="sub">Supabase DB 실시간 조회 · 마감상태 자동분류 · 읽기 전용 데모</div></div>
    <button class="refresh" id="refreshBtn">새로고침</button>
  </div>
  <div class="cards">
    <div class="card"><div class="label">전체 과제</div><div class="value" id="kpiTotal">-</div></div>
    <div class="card"><div class="label">완료</div><div class="value" id="kpiDone">-</div></div>
    <div class="card"><div class="label">지연</div><div class="value" id="kpiOverdue">-</div></div>
    <div class="card"><div class="label">오늘 마감</div><div class="value" id="kpiToday">-</div></div>
    <div class="card"><div class="label">평균 진행률</div><div class="value" id="kpiProgress">-</div></div>
  </div>
  <div class="filters">
    <input id="q" placeholder="회의명, 업무, 담당자 검색" />
    <select id="department"><option value="">전체 부서</option></select>
    <select id="status"><option value="">전체 상태</option><option>미착수</option><option>진행중</option><option>완료</option><option>보류</option></select>
    <select id="timing"><option value="">전체 마감상태</option><option>지연</option><option>오늘마감</option><option>임박</option><option>정상</option><option>완료</option></select>
  </div>
  <div class="tablebox"><table><thead><tr><th>회의</th><th>부서</th><th>후속조치</th><th>담당자</th><th>우선순위</th><th>마감일</th><th>마감상태</th><th>업무상태</th><th>진행률</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden>조건에 맞는 데이터가 없습니다.</div></div>
</div>
<script>
const SUPABASE_URL='https://anqtlcjpplpigyevkesd.supabase.co';
const SUPABASE_KEY='sb_publishable_M1D4R_cBCk-UClYJZzTOxw_E-s3f8H9';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let rows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){
  document.getElementById('refreshBtn').textContent='불러오는 중...';
  const {data,error}=await db.from('meeting_followup_dashboard').select('*').order('due_date',{ascending:true});
  if(error){document.getElementById('tbody').innerHTML=`<tr><td colspan="9">데이터 조회 오류: ${esc(error.message)}</td></tr>`;return;}
  rows=data||[]; buildDept(); apply(); document.getElementById('refreshBtn').textContent='새로고침';
}
function buildDept(){const el=document.getElementById('department');const cur=el.value;const ds=[...new Set(rows.map(r=>r.department))].sort();el.innerHTML='<option value="">전체 부서</option>'+ds.map(d=>`<option>${esc(d)}</option>`).join('');el.value=cur;}
function apply(){
  const q=document.getElementById('q').value.trim().toLowerCase(), dep=document.getElementById('department').value, st=document.getElementById('status').value, tm=document.getElementById('timing').value;
  const f=rows.filter(r=>(!q||[r.meeting_title,r.action_item,r.assignee].some(v=>String(v).toLowerCase().includes(q)))&&(!dep||r.department===dep)&&(!st||r.status===st)&&(!tm||r.timing_state===tm));
  renderKPI(f); renderTable(f);
}
function renderKPI(a){const n=a.length, done=a.filter(r=>r.status==='완료').length, overdue=a.filter(r=>r.timing_state==='지연').length, today=a.filter(r=>r.timing_state==='오늘마감').length, avg=n?Math.round(a.reduce((s,r)=>s+Number(r.progress||0),0)/n):0; kpiTotal.textContent=n;kpiDone.textContent=done;kpiOverdue.textContent=overdue;kpiToday.textContent=today;kpiProgress.textContent=avg+'%';}
function renderTable(a){const tb=document.getElementById('tbody'), empty=document.getElementById('empty');empty.hidden=a.length>0;tb.innerHTML=a.map(r=>`<tr><td><b>${esc(r.meeting_title)}</b><div class="muted">${esc(r.meeting_date)}</div></td><td>${esc(r.department)}</td><td>${esc(r.action_item)}</td><td>${esc(r.assignee)}</td><td>${esc(r.priority)}</td><td>${esc(r.due_date)}<div class="muted">D${Number(r.days_remaining)>=0?'-'+r.days_remaining:r.days_remaining}</div></td><td><span class="badge ${esc(r.timing_state)}">${esc(r.timing_state)}</span></td><td>${esc(r.status)}</td><td>${esc(r.progress)}%<div class="pbar"><span style="width:${Number(r.progress)}%"></span></div></td></tr>`).join('');}
['q','department','status','timing'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',apply));
document.getElementById('refreshBtn').addEventListener('click',load); load();
</script>
</body>
</html>
